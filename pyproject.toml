[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "reprosieve"
version = "0.1.0a4"
description = "Reduce failed agent traces into redacted offline predicate reproductions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "ReproSieve contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/DelshadH/reprosieve"
Issues = "https://github.com/DelshadH/reprosieve/issues"
Source = "https://github.com/DelshadH/reprosieve"

[project.optional-dependencies]
openai = ["openai-agents>=0.18.3,<0.20"]
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "detect-secrets==1.5.0",
  "hypothesis==6.161.2",
  "mypy==2.3.0",
  "openai-agents==0.19.1",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0"
]

[project.scripts]
reprosieve = "reprosieve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reprosieve"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "reprosieve/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/src/reprosieve",
  "/schemas",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["FURB162", "TRY004", "UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/gates/RS_G*.py" = ["N999"]
".evidence/**/reproduce.py" = ["BLE001", "RUF100"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reprosieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
