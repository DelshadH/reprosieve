[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "runsieve"
version = "0.0.1"
description = "Reduce failed agent traces into redacted offline predicate reproductions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "RunSieve contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/DelshadH/runsieve"
Issues = "https://github.com/DelshadH/runsieve/issues"
Source = "https://github.com/DelshadH/runsieve"

[project.optional-dependencies]
openai = ["openai-agents>=0.18.3,<0.19"]
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "detect-secrets==1.5.0",
  "hypothesis==6.161.2",
  "mypy==2.3.0",
  "openai-agents==0.18.3",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0"
]

[project.scripts]
runsieve = "runsieve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runsieve"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "runsieve/schemas"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["FURB162", "TRY004", "UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/gates/RS_G*.py" = ["N999"]
".evidence/**/reproduce.py" = ["BLE001", "RUF100"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["runsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
