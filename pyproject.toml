[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runsieve"
version = "0.0.0"
description = "Minimize failed AI-agent runs into hermetic reproductions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RunSieve contributors" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai-agents>=0.18.3,<0.19"]
dev = [
  "mypy>=1.16",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "hypothesis>=6.135"
]

[project.scripts]
runsieve = "runsieve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runsieve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["runsieve"]
