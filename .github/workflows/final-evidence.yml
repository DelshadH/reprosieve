name: Final release evidence

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact canonical main commit to verify
        required: true
        type: string

permissions: {}

env:
  RUNSIEVE_EVIDENCE_COMMIT: ${{ inputs.commit }}

jobs:
  package-proof:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.5.0
      - run: python -m scripts.package_matrix_proof --output "${{ runner.temp }}/proof"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v3.2.0
        with:
          subject-path: "${{ runner.temp }}/proof/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-package-py${{ matrix.python }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error

  portable-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.portable_reproduction_proof --output "${{ runner.temp }}/proof"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v3.2.0
        with:
          subject-path: "${{ runner.temp }}/proof/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-portable-${{ matrix.platform }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error

  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m scripts.final_release_gate
          --output "${{ runner.temp }}/exact-head.json"
      - run: python -m scripts.generate_application_replay_evidence "${{ runner.temp }}/app"
      - run: >-
          python -m scripts.verify_application_replay_evidence
          "${{ runner.temp }}/app"
          "$RUNSIEVE_EVIDENCE_COMMIT"
          --output "${{ runner.temp }}/app/verification.json"
      - run: tar -C "${{ runner.temp }}" -czf "${{ runner.temp }}/application-replay.tgz" app
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v3.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/exact-head.json
            ${{ runner.temp }}/application-replay.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-exact-head
          path: |
            ${{ runner.temp }}/exact-head.json
            ${{ runner.temp }}/application-replay.tgz
          if-no-files-found: error

  rs-g10:
    needs: portable-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: final-portable-*
          path: ${{ runner.temp }}/proofs
      - name: Verify proof provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: find "${{ runner.temp }}/proofs" -type f -exec gh attestation verify {} --repo "${{ github.repository }}" \;
      - run: >-
          python -m scripts.generate_gate_evidence RS-G10
          "final-${{ github.run_id }}-${{ github.run_attempt }}"
          --proof-input "${{ runner.temp }}/proofs/final-portable-linux"
          --proof-input "${{ runner.temp }}/proofs/final-portable-macos"
      - run: >-
          python -m scripts.gates.RS_G10
          ".evidence/RS-G10/final-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json"
      - run: tar -czf "${{ runner.temp }}/rs-g10.tgz" ".evidence/RS-G10/final-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v3.2.0
        with:
          subject-path: "${{ runner.temp }}/rs-g10.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-rs-g10
          path: ${{ runner.temp }}/rs-g10.tgz

  rs-g13:
    needs: package-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: final-package-*
          path: ${{ runner.temp }}/proofs
      - name: Verify proof provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: find "${{ runner.temp }}/proofs" -type f -exec gh attestation verify {} --repo "${{ github.repository }}" \;
      - run: >-
          python -m scripts.generate_gate_evidence RS-G13
          "final-${{ github.run_id }}-${{ github.run_attempt }}"
          --proof-input "${{ runner.temp }}/proofs/final-package-py3.11"
          --proof-input "${{ runner.temp }}/proofs/final-package-py3.12"
          --proof-input "${{ runner.temp }}/proofs/final-package-py3.13"
      - run: >-
          python -m scripts.gates.RS_G13
          ".evidence/RS-G13/final-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json"
      - run: tar -czf "${{ runner.temp }}/rs-g13.tgz" ".evidence/RS-G13/final-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v3.2.0
        with:
          subject-path: "${{ runner.temp }}/rs-g13.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-rs-g13
          path: ${{ runner.temp }}/rs-g13.tgz

  final:
    needs: [exact-head, rs-g10, rs-g13]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: final-*
          path: final
      - name: Verify every final evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: find final -type f -exec gh attestation verify {} --repo "${{ github.repository }}" \;
      - name: Publish final decision receipt
        run: >-
          python -c "import json,os,pathlib;
          pathlib.Path('final-decision-receipt.json').write_text(
          json.dumps({'commit':os.environ['RUNSIEVE_EVIDENCE_COMMIT'],
          'gate':'final-release-evidence','passed':True,
          'workflow_run':'${{ github.run_id }}-${{ github.run_attempt }}'},
          sort_keys=True,separators=(',',':'))+'\\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-decision-receipt
          path: final-decision-receipt.json
