name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNSIEVE_EVIDENCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RUNSIEVE_EVIDENCE_COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Build candidate distributions twice and compare bytes
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0
          python -m scripts.package_matrix_proof --output release-proof
      - name: Inspect and run installed public CLI flows
        run: |
          python -m zipfile -l release-proof/runsieve-*.whl
          python -m scripts.installed_cli_smoke --wheel release-proof/runsieve-*.whl --with-openai
      - name: Attest wheel and sdist provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: "release-proof/runsieve-*"
      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runsieve-${{ github.ref_name }}
          path: |
            release-proof/*
            schemas/*
          if-no-files-found: error
          retention-days: 30
